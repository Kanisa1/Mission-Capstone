services:
  - type: web
    name: mineraltrace-api
    env: python
    plan: free
    rootDir: API
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker api:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_EMAIL
        value: "true"
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"

  - type: web
    name: mineraltrace-web
    env: static
    rootDir: webapp
    buildCommand: ""
    staticPublishPath: .
