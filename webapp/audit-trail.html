<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail - MineralTrace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="../assets/logo.png" alt="Geoacoustic Fingerprinting" class="logo-img">
                <span>MineralTrace</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <span class="nav-section-title">MANAGEMENT</span>
                <a href="index.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="verifications.html" class="nav-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Verifications</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
                <a href="scans.html" class="nav-item">
                    <i class="fas fa-camera"></i>
                    <span>Scans</span>
                </a>
                <a href="sites.html" class="nav-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Sites</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-section-title">SETTINGS</span>
                <a href="audit-trail.html" class="nav-item active">
                    <i class="fas fa-history"></i>
                    <span>Audit Trail</span>
                </a>
                <a href="users.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Reports</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search audit logs..." id="searchInput">
            </div>
            
            <div class="top-bar-actions">
                <div class="stat-pill">
                    <span class="label">Total Events:</span>
                    <span class="value" id="totalEvents">0</span>
                </div>
                <div class="stat-pill">
                    <span class="label">Today:</span>
                    <span class="value success" id="todayEvents">0</span>
                </div>
                
                <button class="btn-notification">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" style="display: none;">0</span>
                </button>
                
                <div class="user-menu" title="Admin User">
                    <div class="user-avatar-small">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Audit Trail</h1>
                <p class="page-subtitle">View complete system activity history</p>
            </div>
            <div class="page-actions">
                <select id="actionFilter" class="filter-select">
                    <option value="">All Actions</option>
                    <option value="scan">Scan Created</option>
                    <option value="verification">Verification</option>
                    <option value="user">User Action</option>
                    <option value="system">System Event</option>
                </select>
                <select id="userFilter" class="filter-select">
                    <option value="">All Users</option>
                </select>
                <select id="timeFilter" class="filter-select">
                    <option value="all">All Time</option>
                    <option value="today">Today</option>
                    <option value="week">Last 7 Days</option>
                    <option value="month">Last 30 Days</option>
                </select>
                <button class="action-btn primary" onclick="window.location.reload()">
                    <i class="fas fa-sync"></i>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Audit Trail Timeline -->
        <div class="card">
            <div class="audit-timeline" id="auditTimeline">
                <!-- Timeline items will be inserted here -->
            </div>
            
            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-history"></i>
                <p>No audit logs found</p>
            </div>
            
            <!-- Pagination -->
            <div class="table-footer">
                <div class="pagination-info">
                    Showing <span id="startItem">0</span> to <span id="endItem">0</span> of <span id="totalItems">0</span> events
                </div>
                <div class="pagination">
                    <button id="prevPage" class="pagination-btn" disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="page-info">
                        Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
                    </span>
                    <button id="nextPage" class="pagination-btn" disabled>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { NotificationManager } from './js/notifications.js';
        window.notificationManager = new NotificationManager();
        notificationManager.init();
    </script>
    <script type="module" src="js/audit-trail.js"></script>
</body>
</html>
