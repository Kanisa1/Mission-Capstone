<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sites - Mineral Traceability</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="far fa-gem logo-icon" aria-hidden="true"></i>
                <span>MineralTrace</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <span class="nav-section-title">Management</span>
                <a href="index.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="verifications.html" class="nav-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Verifications</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
                <a href="scans.html" class="nav-item">
                    <i class="fas fa-fingerprint"></i>
                    <span>Scans</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-section-title">Settings</span>
                <a href="audit-trail.html" class="nav-item">
                    <i class="fas fa-history"></i>
                    <span>Audit Trail</span>
                </a>
                <a href="sites.html" class="nav-item active">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Sites</span>
                </a>
                <a href="users.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Reports</span>
                </a>
            </div>
        </nav>

    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search sites...">
            </div>
            
            <div class="top-bar-actions">
                <div class="stat-pill">
                    <span class="label">Sites:</span>
                    <span class="value" id="totalSites">3</span>
                </div>
                <div class="stat-pill">
                    <span class="label">Active:</span>
                    <span class="value success" id="activeSites">3</span>
                </div>
                
                <button class="btn-notification">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" style="display: none;">0</span>
                </button>
                
                <div class="user-menu" title="Admin User">
                    <div class="user-avatar-small">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Mining Sites</h1>
                <p class="page-subtitle">Performance and activity monitoring across all locations</p>
            </div>
            <div class="page-actions">
                <button class="action-btn primary" onclick="window.location.reload()">
                    <i class="fas fa-sync"></i>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Sites Grid -->
        <div id="sitesContainer" class="sites-grid-large">
            <div class="loading-cell">
                <div class="spinner"></div>
                <p>Loading sites...</p>
            </div>
        </div>

        <!-- Site Comparison Chart -->
        <div class="card" style="margin-top: 2rem;">
            <h3><i class="fas fa-chart-bar"></i> Site Comparison</h3>
            <div class="chart-container" style="height: 350px;">
                <canvas id="siteComparisonChart"></canvas>
            </div>
        </div>

        <!-- Mineral Distribution by Site -->
        <div class="card" style="margin-top: 2rem;">
            <h3><i class="fas fa-gem"></i> Mineral Distribution by Site</h3>
            <div class="chart-container" style="height: 350px;">
                <canvas id="mineralDistributionChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script type="module">
        import { NotificationManager } from './js/notifications.js';
        window.notificationManager = new NotificationManager();
        notificationManager.init();
    </script>
    <script src="js/sites.js"></script>
</body>
</html>
