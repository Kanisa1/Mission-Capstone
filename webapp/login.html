<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MineralTrace</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 20% 10%, rgba(44, 110, 145, 0.38) 0%, transparent 35%),
                        radial-gradient(circle at 80% 85%, rgba(191, 220, 208, 0.36) 0%, transparent 38%),
                        var(--gradient-brand);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .login-bg-photo {
            position: fixed;
            inset: 0;
            background: url('../dataset/images/Central_Equatoria/gold/00081230017663975235325.jpg') center / cover no-repeat;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 520ms ease;
            z-index: 1;
            pointer-events: none;
            filter: saturate(1.05) contrast(1.02);
        }

        body.photo-mode .login-bg-photo {
            opacity: 0.33;
            animation: photoPan 24s ease-in-out infinite alternate;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            pointer-events: none;
        }

        body::before {
            inset: -10% -10% -10% -10%;
            background: url('../assets/logo.png') center / 420px auto no-repeat;
            opacity: 0.08;
            transform: rotate(-8deg) scale(1.06);
            animation: bgPulse 12s ease-in-out infinite;
            filter: blur(0.4px);
        }

        body::after {
            inset: 0;
            background:
                radial-gradient(circle at 18% 22%, rgba(191, 220, 208, 0.28) 0%, rgba(191, 220, 208, 0) 42%),
                radial-gradient(circle at 82% 24%, rgba(44, 110, 145, 0.34) 0%, rgba(44, 110, 145, 0) 45%),
                radial-gradient(circle at 32% 82%, rgba(10, 53, 82, 0.28) 0%, rgba(10, 53, 82, 0) 44%);
            animation: auroraShift 16s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: rotate(-8deg) scale(1.05); opacity: 0.07; }
            50% { transform: rotate(-3deg) scale(1.12); opacity: 0.12; }
        }

        @keyframes auroraShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            35% { transform: translate(-1.5%, 1.5%) scale(1.05); }
            70% { transform: translate(1.2%, -1.2%) scale(1.02); }
        }

        @keyframes photoPan {
            0% { transform: scale(1.08) translate(0%, 0%); }
            50% { transform: scale(1.14) translate(-1.2%, 0.8%); }
            100% { transform: scale(1.09) translate(1.1%, -0.6%); }
        }

        .bg-mode-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 6;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .bg-mode-btn {
            border: none;
            border-radius: 999px;
            padding: 0.42rem 0.72rem;
            font-size: 0.76rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.84);
            background: transparent;
            cursor: pointer;
            transition: background 0.22s ease, color 0.22s ease, transform 0.22s ease;
        }

        .bg-mode-btn:hover {
            transform: translateY(-1px);
            color: #fff;
        }

        .bg-mode-btn.active {
            background: rgba(255, 255, 255, 0.24);
            color: #fff;
        }

        .login-card {
            position: relative;
            z-index: 4;
            width: 100%;
            max-width: 450px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 252, 255, 0.82) 100%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 20px;
            box-shadow: 0 24px 65px rgba(8, 42, 66, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.45);
            padding: 2.15rem;
            animation: loginLift 700ms cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(130deg, rgba(191, 220, 208, 0.15) 0%, rgba(44, 110, 145, 0.12) 52%, rgba(10, 53, 82, 0.08) 100%);
            pointer-events: none;
        }

        .login-card::after {
            content: '';
            position: absolute;
            inset: auto 20px 18px auto;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: url('../assets/logo.png') center / contain no-repeat;
            opacity: 0.09;
            pointer-events: none;
            animation: badgeFloat 6s ease-in-out infinite;
        }

        @keyframes loginLift {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.6rem;
            position: relative;
            z-index: 1;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 0.85rem;
            filter: drop-shadow(0 8px 18px rgba(10, 53, 82, 0.28));
            animation: logoFloat 4.8s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .login-title {
            font-size: 1.62rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
            letter-spacing: 0.02em;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .form-group {
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 0.92rem;
            border: 1px solid rgba(10, 53, 82, 0.16);
            background: rgba(255, 255, 255, 0.88);
            border-radius: 12px;
            font-size: 0.95rem;
            transition: border-color 0.22s, box-shadow 0.22s, transform 0.22s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(44, 110, 145, 0.14);
            transform: translateY(-1px);
        }

        .login-error {
            display: none;
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            background: rgba(214, 48, 49, 0.12);
            color: var(--error);
            border: 1px solid rgba(214, 48, 49, 0.3);
            font-size: 0.9rem;
        }

        .login-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 62%, var(--accent-gold) 100%);
            color: var(--text-white);
            padding: 0.9rem 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.24s, box-shadow 0.24s, filter 0.24s;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 90%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0) 100%);
            transition: left 0.48s ease;
            pointer-events: none;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(10, 53, 82, 0.28);
            filter: saturate(1.05);
        }

        .login-btn:hover::before {
            left: 135%;
        }

        .login-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .login-note {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 520px) {
            .login-card {
                padding: 1.45rem;
                max-width: 100%;
            }

            .login-title {
                font-size: 1.35rem;
            }

            .bg-mode-toggle {
                top: 0.7rem;
                right: 0.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before,
            body::after,
            .login-bg-photo,
            .login-logo,
            .login-card,
            .login-card::after {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-bg-photo" aria-hidden="true"></div>

    <div class="bg-mode-toggle" role="group" aria-label="Background style">
        <button type="button" class="bg-mode-btn" data-mode="photo">Photo</button>
        <button type="button" class="bg-mode-btn" data-mode="art">Art</button>
    </div>

    <div class="login-card">
        <div class="login-header">
            <img src="../assets/logo.png" alt="MineralTrace" class="login-logo">
            <h1 class="login-title">Admin Login</h1>
            <p class="login-subtitle">Only administrator accounts can access the web dashboard.</p>
        </div>

        <div id="loginError" class="login-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <p class="login-note">Use your administrator email and password.</p>
    </div>

    <script>
        (() => {
            const STORAGE_KEY = 'minerals.login.backgroundMode';
            const validModes = ['photo', 'art'];
            const params = new URLSearchParams(window.location.search);
            const queryMode = params.get('bg');
            const savedMode = localStorage.getItem(STORAGE_KEY);
            const initialMode = validModes.includes(queryMode)
                ? queryMode
                : (validModes.includes(savedMode) ? savedMode : 'photo');

            const applyMode = (mode) => {
                document.body.classList.toggle('photo-mode', mode === 'photo');
                document.querySelectorAll('.bg-mode-btn').forEach((button) => {
                    const active = button.dataset.mode === mode;
                    button.classList.toggle('active', active);
                    button.setAttribute('aria-pressed', active ? 'true' : 'false');
                });
                localStorage.setItem(STORAGE_KEY, mode);
            };

            document.querySelectorAll('.bg-mode-btn').forEach((button) => {
                button.addEventListener('click', () => applyMode(button.dataset.mode));
            });

            applyMode(initialMode);
        })();
    </script>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
