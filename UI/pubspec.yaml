publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  file_picker: ^8.0.0
  http: ^1.2.1
  intl: ^0.18.0
  image_picker: ^1.0.7
  record: ^6.0.0
  path_provider: ^2.1.1
